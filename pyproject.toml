[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-chess"
version = "0.1.0"
description = "로컬 사람 대 언어 모델 체스 앱"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "python-chess>=1.999,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
chess = "llm_chess.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_chess"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/llm_chess",
    "/install.ps1",
    "/start.cmd",
]

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
